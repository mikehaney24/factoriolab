<div class="gap-1 sm:gap-2 flex">
  <button
    type="button"
    labButton
    [faIcon]="faGear"
    text="flow.flowSettings"
    (click)="dialog.open(FlowSettingsDialog)"
  ></button>
  @let _flowData = flowBuilder.flowData();
  @if (_flowData && _flowData.nodes.length) {
    <div class="mr-4 flex items-center gap-2">
      <button
        type="button"
        labButton
        [faIcon]="faCopy"
        [text]="exportText()"
        (click)="exportBlueprint()"
      ></button>
      <lab-dropdown controlId="export-options" [border]="true">
        <span class="whitespace-nowrap px-3">Options</span>
        <ng-template #overlay>
          <div class="flex flex-col gap-2">
            <label class="flex items-center gap-1 whitespace-nowrap text-sm">
              <input type="checkbox" [checked]="exportSmelters()" (change)="exportSmelters.set(!exportSmelters())" />
              Smelters
            </label>
          </div>
        </ng-template>
      </lab-dropdown>
    </div>
    <button
      type="button"
      labButton
      [faIcon]="faFileArrowDown"
      text="flow.downloadAsJson"
      (click)="exporter.flowToJson(_flowData)"
    ></button>
  }
</div>

<div
  id="lab-flow-svg"
  class="rounded-xs flex border border-gray-700"
  #svg
></div>
<lab-steps [focus]="true" [selectedId]="selectedId()"></lab-steps>
